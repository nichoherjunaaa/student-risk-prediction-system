server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Flask backend container.
    # Resolve the upstream lazily via Docker's embedded DNS so Nginx still
    # starts when the backend is briefly down, and picks up its new IP after
    # a redeploy instead of caching a stale one.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sisip_backend "backend:5000";
        proxy_pass http://$sisip_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Model training / batch prediction can take several minutes
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Cache built static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
